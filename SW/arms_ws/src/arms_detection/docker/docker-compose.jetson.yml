services:
  arms_detection:
    build:
      # context = arms_ws/src/ so Dockerfile can COPY arms_msgs/ and arms_detection/
      context: ../..
      dockerfile: arms_detection/docker/Dockerfile.jetson
    image: arms/detection:jetson

    # network_mode: host — container shares the host network stack.
    # ipc: host — FastDDS shared memory transport가 호스트 프로세스와 같은
    #             IPC 네임스페이스를 쓰도록 강제.
    network_mode: host
    ipc: host

    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - RMW_IMPLEMENTATION=${RMW_IMPLEMENTATION:-rmw_fastrtps_cpp}
      # Force UDP-only FastDDS transport. SHM transport fails between container
      # and host because FastDDS SHM requires FD passing via Unix socket, which
      # does not work across the container boundary even with ipc: host.
      - FASTRTPS_DEFAULT_PROFILES_FILE=/fastdds_udp.xml
      - ARMS_MODEL=${ARMS_MODEL:-/models/best_nano_v6.engine}
      # 실내 기본값 0.25 (야외/원거리는 0.32~). YOLO 가 실내에서 표적을 놓치면
      # 이 값을 더 낮춰본다. control 노드의 detection_confidence_threshold(실기체 0.25)와 맞춤.
      - ARMS_CONF=${ARMS_CONF:-0.25}
      - ARMS_IOU=${ARMS_IOU:-0.45}
      # 정적 TensorRT 엔진(balloon_camera.engine)은 단일 크기(320)로 빌드됨 →
      # full/ROI 둘 다 320 으로 맞춰야 한다. (512 로 두면 full-frame 추론이
      # 엔진 크기와 안 맞아 실패). .pt 나 dynamic 엔진이면 512 도 가능.
      - ARMS_FULL_IMGSZ=${ARMS_FULL_IMGSZ:-320}
      - ARMS_ROI_IMGSZ=${ARMS_ROI_IMGSZ:-320}
      # 1=압축(JPEG) 입력 구독(/arms/image_raw/compressed) → 컨테이너로 오는 UDP
      # 데이터량 급감(조각 드롭↓). 호스트에서 raw→compressed 노드가 떠 있어야 한다.
      - ARMS_INPUT_COMPRESSED=${ARMS_INPUT_COMPRESSED:-1}
      # 검출 파라미터 override 파일명. 비어있으면 기본(detection.yaml=실외)만 로드.
      #   실내: ARMS_DET_CONFIG=detection.indoor.yaml
      - ARMS_DET_CONFIG=${ARMS_DET_CONFIG:-}
    volumes:
      - ./models:/models:ro # balloon_camera.pt 또는 변환한 .engine
      - ./fastdds_udp.xml:/fastdds_udp.xml:ro
      # 노드 소스를 바인드 마운트 → 코드 수정 시 이미지 재빌드 없이 컨테이너
      # 재시작(docker compose restart arms_detection)만으로 반영. Dockerfile 이
      # 같은 경로로 COPY 한 파일 위에 덮어씌운다. (의존성/Dockerfile 변경 때만 재빌드)
      - ../arms_detection/arms_detection_node.py:/ros_ws/arms_detection_node.py:ro
      # 검출 파라미터 config → --params-file 로 로드. yaml 만 고치고
      # `docker compose ... restart` 하면 반영(재빌드 불필요).
      - ../config:/params:ro
    # 검출 파라미터 config(detection.yaml=실외)를 --params-file 로 로드. 실내 등
    #   override 는 ARMS_DET_CONFIG 로 위에 얹는다(SETUP.md A-5 참고):
    #     ARMS_DET_CONFIG=detection.indoor.yaml docker compose -f docker-compose.jetson.yml up -d
    command:
      - bash
      - -c
      - "source /opt/ros/humble/setup.bash && source /ros_ws/install/setup.bash && python3 /ros_ws/arms_detection_node.py --ros-args --params-file /params/detection.yaml $${ARMS_DET_CONFIG:+--params-file /params/$$ARMS_DET_CONFIG}"
    restart: unless-stopped
