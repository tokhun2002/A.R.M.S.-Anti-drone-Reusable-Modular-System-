# A.R.M.S. 실내 검출 override (arms_detection_node)
# ---------------------------------------------------------------------------
# detection.yaml(기본=실외) 위에 얹는 델타. 기본은 실외라 이 파일은
# 실내에서만 opt-in 한다:
#   ARMS_DET_CONFIG=detection.indoor.yaml docker compose ... up -d   (SETUP.md 참고)
#
# 실내 상황 가정:
#   · 조명(형광/LED)으로 붉은 표적의 채도가 낮아지고 hue 가 흔들림 → 색 게이트 완화.
#   · 시험 때 표적을 카메라 가까이 대 화면을 크게 차지 → 면적 상한↑.
#
# 기본(실외) 대비 바뀌는 값만 적는다. 나머지는 detection.yaml 를 그대로 쓴다.
arms_detection_node:
  ros__parameters:
    hsv:
      # 면적: 작은 조명/노이즈 컷(하한↑). 상한은 없음(근접 표적 유지 — base 와 동일)
      min_area_ratio: 0.0006
      # 색: 실내 조명에서 채도 낮고 hue 이동한 붉은색도 후보로 (완화)
      prob_threshold: 0.18
      hue_sigma: 20.0
      sat_center: 55.0
      sat_scale: 34.0
      val_min: 20.0
      val_max_center: 250.0
      val_scale: 34.0
      # 형상: 부분 가림/찌그러짐 허용
      min_circularity: 0.18
      max_candidates: 2
