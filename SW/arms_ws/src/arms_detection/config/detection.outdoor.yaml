# A.R.M.S. 실외 검출 튜닝 (arms_detection_node)  — 기본 로드 config
# ---------------------------------------------------------------------------
# bringup 의 docker compose 가 --params-file 로 이 파일을 로드한다(기본값).
#   실내로 바꾸려면: ARMS_DET_CONFIG=detection.indoor.yaml (아래 SETUP.md 참고)
#   (docker-compose.jetson.yml 의 command + ../config:/params 마운트)
#
# 실외 상황 가정:
#   · 자연광(햇빛)이라 붉은 표적의 채도·hue 가 뚜렷하다 → 색 게이트를 실내보다 조인다
#     (희끄무레한 하늘/구름/반사광 오탐 억제).
#   · 표적이 멀어 화면에서 작게 잡힌다 → 면적 하한을 낮추고 상한도 과하게 크지 않게.
#
# ★ 아래 값은 실외 "시작점"이다. 실제 필드에서 표적 크기·조명에 맞춰 튜닝하고,
#   확정되면 근거(촬영 날짜/거리)를 주석에 남길 것.
#
# yaml 만 고치고 `docker compose ... restart` 하면 반영된다(재빌드 불필요).
arms_detection_node:
  ros__parameters:
    proc_width: 320
    use_yolo: true
    use_hsv: true

    # full_fallback_interval 은 노드 코드 기본값(1=매프레임 전체화면 YOLO)을 그대로 쓴다.
    #   실외는 채도 높은 붉은 표적이라 HSV 후보가 잘 잡히니, GPU 부하가 부담되면
    #   여기에 yolo.full_fallback_interval: 2 를 추가해 2프레임마다로 낮춰도 된다.

    hsv:
      # --- 면적 게이트 ---
      #   상한: 화면을 꽉 채우는 초근접은 실외에서 드물다 → 0.6.
      #   하한: 멀리 있는 작은 표적을 살리되 1~3px 노이즈는 컷 → 0.0004.
      max_area_ratio: 0.6
      min_area_ratio: 0.0004
      # --- 색 게이트 (자연광: 실내보다 조인다) ---
      #   채도 중심을 높이고(옅은 색 배제) 확률 임계도 올려 하늘/구름/밝은 반사 오탐을 줄인다.
      prob_threshold: 0.25
      hue_sigma: 15.0
      sat_center: 100.0
      sat_scale: 40.0
      val_min: 40.0
      val_max_center: 230.0
      val_scale: 40.0
      # --- 형상 게이트 ---
      #   원형 표적(풍선) 기준. 실외 클러터가 많으면 원형도 하한을 더 올린다.
      min_circularity: 0.30
      max_candidates: 3
