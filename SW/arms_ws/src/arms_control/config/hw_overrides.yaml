# 실기체(Jetson) 전용 오버레이 — control_params.yaml 위에 얹힌다.
#
# 여기에는 "실기체가 SITL과 다른 것"만 적는다.
#
# 로드 순서 (뒤가 이김):
#   control.launch.py       control_params.yaml → 이 파일
#   arms.launch.py          control_params.yaml → 이 파일 → crsf_port 인자
#   *_sitl.launch.py        control_params.yaml 만  ← 이 파일 안 실림
#
# ELRS 모듈이 연결된 포트/속도.
#   - USB-C(CP2102 USB-UART, full duplex): /dev/ttyUSB0   ← 현재 셋업, baud 115200
#       번호 고정: /dev/serial/by-id/usb-Silicon_Labs_CP2102_USB_to_UART_Bridge_Controller_0001-if00-port0
arms_control_node:
  ros__parameters:
    crsf:
      port: "/dev/ttyUSB0"
      baud: 115200

    # 실기체 배터리: 측정 전압으로 잔량(%)을 계산한다.
    #   cell_count 를 실제 직렬 셀 수로 맞춰라 (예: 4S→4, 6S→6).
    #   방전 컷오프를 보수적으로 잡고 싶으면 cell_empty_v 를 3.5~3.6 으로 올린다.
    battery:
      cell_count: 4
      cell_full_v: 4.2
      cell_empty_v: 3.5

    # 실기체: 발사 잠금장치 서보 활성화 (핀15 PWM1, pwmchip0 ch0).
    #   전제: jetson-io 로 핀15 PWM1 pinmux 설정 + /sys/class/pwm 쓰기 권한(99-gpio.rules).
    servo:
      enabled: true

    mission:
      # 실기체는 자동 발진 금지. LOCK 이 걸려도 스스로 TRACK 으로 넘어가지 않고,
      # 사람이 조종기 LAUNCH(buttons[3]) 를 눌러야 추격이 시작된다.
      # control_params.yaml 은 SITL 편의를 위해 true 다.
      sitl_auto_launch: false

    control:
      # ── 실기체 PID (미측정) ──────────────────────────────────────────────
      # 단위: 정규화 픽셀오차 → 각속도[deg/s]. 각도 단계는 없다(ACRO 고정).
      # 튜닝 순서: kp 를 낮은 값에서 조금씩 ↑ → 떨리면 30% ↓ → 그 다음 kd.
      #   과조향/발진이면 kp 와 pn_nav_gain 을 먼저 내린다.
      #
      # 실기체 값이 확정되면 이 주석의 "미측정"을 지우고 근거(비행 날짜/로그)를 남길 것.
      roll_pid:
        kp: 100.0
        ki: 0.0
        kd: 3.5
      pitch_pid:
        kp: 100.0
        ki: 0.0
        kd: 3.5
