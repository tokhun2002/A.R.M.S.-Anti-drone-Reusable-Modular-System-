# arms_control_node 파라미터 (SITL 기준값 = 코드 기본값).
#
# ★ 여기 값은 arms_control_node.cpp 의 declare_parameter 기본값과 같게 유지한다.
#   값을 바꿀 땐 반드시 둘 다 바꿔라.
#
# 실기체는 hw_overrides.yaml 이 이 위에 얹혀 델타만 덮어쓴다
# (control.launch.py / arms.launch.py). SITL 런치는 이 파일만 읽는다.

arms_control_node:
  ros__parameters:

    # =====================================================================
    # 미션 상태머신
    # =====================================================================
    mission:

      # ── 검출 → LOCK 판정 ──────────────────────────────────────────────
      # 카메라 재학습 모델의 validation F1 최적 confidence(0.32)에 맞춘 값.
      # 오검출은 아래 1초 연속 LOCK 판정과 detection 노드의 CV 시간 게이팅으로 억제한다.
      detection_confidence_threshold: 0.32
      detection_timeout_sec: 1.0
      lock_duration_sec: 1.0

      # ── LOCK → FIRE 판정 (비전 looming, τ) ────────────────────────────
      # 거리센서 없이 bbox 팽창률로 충돌 임박을 판정한다. 3D 거리는 실기체에서
      # 못 쓰므로 sim 포함 전면 제거했고, 발사는 τ 로만 결정된다.
      #   τ = bbox크기 / 크기변화율 = 충돌까지 시간.
      #   스케일 불변이라 표적 크기·카메라와 무관 — 작은 x500도 큰 풍선도 같은 로직.
      #
      # ★ FIRE 는 이 경로 하나로만 들어온다. 심판(referee)의 실제 접촉 판정은
      #   미션에 영향을 주지 않는다(로그 전용) — 채점자가 답을 대신 쓰면
      #   검출이 고장나도 미션이 성공으로 끝나 성능 측정이 오염된다.
      tau_fire_sec: 0.3         # τ 이 값 미만 + 정렬 + 최소크기 → FIRE. 늦으면 ↓, 빨리 터지면 ↑
      fire_align_tol: 0.2       # 정렬 허용오차 (중앙정렬 만족해야 발사)
      loom_s_min: 0.1           # 최소 bbox 크기(정규화). 원거리/노이즈 오탐 차단
      loom_size_alpha: 0.3      # bbox 크기 EMA (클수록 민첩/노이즈↑)
      loom_rate_alpha: 0.3      # 크기변화율(ṡ) EMA (τ 안정화)

      # ── 자동 발진 ─────────────────────────────────────────────────────
      # 락 되면 사람이 LAUNCH 를 누르지 않아도 auto_launch_delay_sec 뒤에 스스로
      # TRACK 으로 넘어간다. 표적이 '접근할 때' 요격하려는 것(꽁무니 추격 방지).
      #   SITL 전용. 실기체는 hw_overrides.yaml 이 false 로 덮어쓴다 — 한동안
      #   그 주석만 있고 실제 오버라이드가 없어서 실기체도 true 였다.
      sitl_auto_launch: true
      auto_launch_delay_sec: 0.5
      # ── 충돌 판정(FIRE/RTL) 소스 ─────────────────────────────────────
      # 서로 독립적인 두 스위치다. 이름의 sitl/실기체는 "누가 쓰나"의 관례일 뿐,
      # 둘 다 환경과 무관하게 동작한다(오해 방지로 sitl_hit_rtl 을 분리·개명).
      #   hit_rtl_via_referee : 심판 /arms/hit(Gazebo 접촉) 수신 시 RTL.
      #     → SITL 만 해당(실기체엔 /arms/hit 발행자 없음). 실기체는 hw_overrides 가 false.
      #   looming_fire_enabled: 비전 τ(bbox 팽창률)로 충돌 임박 판정 → FIRE.
      #     → 실기체 자동 요격 경로. 아직 비활성(false). 실기체 검증 뒤 hw_overrides 에서 true.
      # 조합: SITL=(true,false) / 실기체 현재=(false,false) / 실기체 요격=(false,true).
      hit_rtl_via_referee: true
      looming_fire_enabled: false

    # =====================================================================
    # 발사 잠금장치 서보 (Jetson 하드웨어 PWM, sysfs)
    # =====================================================================
    #   기본 enabled=false → SITL/개발 PC 에서 /sys/class/pwm 를 건드리지 않는다.
    #   실기체는 hw_overrides.yaml 이 enabled=true 로 덮어쓴다.
    #   각도 방향은 lock_duty_ns/open_duty_ns 스왑으로 반전.
    servo:
      enabled: false
      chip_path: "/sys/class/pwm/pwmchip0"   # 핀15=GP88_PWM1=3280000.pwm=pwmchip0
      channel: 0
      period_ns: 20000000    # 50Hz = 20ms
      lock_duty_ns: 1500000  # 90°  = 1.5ms (LOCK 기본)
      open_duty_ns: 2500000  # 180° = 2.5ms (OPEN 기본)

    # =====================================================================
    # 배터리 잔량(%) 계산  — UI 좌측 하단 표시에 쓰인다.
    # =====================================================================
    # 셀 수는 전압으로 자동 감지한다(cells = ceil(V / 4.3), 연결 시점 전압으로 6S/4S 등 판별,
    #   첫 유효 전압에서 1회 감지 후 래치). 잔량은 감지된 셀 수로 선형 근사한다:
    #     pct = (전압 - cells·cell_empty_v) ÷ (cells·(cell_full_v - cell_empty_v)),  0~100% clamp
    battery:
      cell_full_v: 4.2     # 만충 시 셀당 전압[V]
      cell_empty_v: 3.5    # 방전(0%) 셀당 전압[V]

    # =====================================================================
    # 제어
    # =====================================================================
    # 신호 흐름 (자동요격은 PX4 ACRO 고정):
    #
    #   픽셀오차 ─→ [기본 추적 PID | PN] ─→ 각속도[deg/s]
    #            ─→ clamp(max_cmd_rate_dps) ─→ ÷max_rate_dps ─→ CRSF
    #
    control:

      # ── 루프 ──────────────────────────────────────────────────────────
      control_rate_hz: 50.0   # 제어 주파수. 높을수록 반응 빠르고 매끄러움(PN 정확도↑). 카메라 60Hz 와 짝

      # ── 유도 방식 ─────────────────────────────────────────────────────
      # 0 = 기본 추적 (픽셀오차 PID 추종)
      # 1 = PN 비례항법 (시선각속도를 없애도록 조종 → 미래 충돌점을 앞질러 겨냥)
      guidance_mode: 0

      # 중심 근처 게인 감쇠(gain_scale / pitch_scale) 스위치. false = 순수 P.
      #   켜면 느린 표적이 중심 근처일 때 게인을 0.5~0.75 배로 낮추고, roll 오차가
      #   크면 pitch 를 0.8~0.9 배로 누른다. 구 물리량 시절 지터 대책이라 현재
      #   기체에서는 재검증 전이다. deadzone 과 같이 "중심 근처에서 일부러 약해지는"
      #   장치라, 표적이 중앙에 안 붙는 증상을 만들 수 있다.
      gain_shaping: false

      # ── 기본 추적 PID (guidance_mode 0) ───────────────────────────────
      # 단위: 정규화 픽셀오차 → 각속도[deg/s].
      #   출력 한계는 아래 max_cmd_rate_dps 하나다 (per-PID output_limit 삭제).
      #   kp 를 올릴 때 포화 시작점이 같이 내려간다: |오차| = max_cmd_rate_dps/kp
      #   부터 P 항만으로 최대 출력이라, 그 위로는 kp 를 올려도 아무것도 안 바뀐다.
      # 튜닝 순서: kp 를 낮은 값에서 조금씩 ↑ (떨리면 30% ↓) → 그 다음 kd → lead.
      roll_pid:
        kp: 400.0
        ki: 0.0
        kd: 3.5
      pitch_pid:
        kp: 400.0
        ki: 0.0
        kd: 3.5

      roll_sign: 1.0
      pitch_sign: 1.0

      # 예측 조준(lead): 움직이는 표적의 미래 위치를 겨냥. PN 이 리드를 담당하므로
      # guidance_mode 1 에서는 꺼 둔다(0.0).
      lead_gain: 0.0
      lead_dot_alpha: 0.2     # 표적 속도추정 LPF (클수록 예측 민첩/노이즈↑)
      lead_clamp: 0.6         # 속도추정 스파이크 제한

      # ── PN 비례항법 (guidance_mode 1) ─────────────────────────────────
      # ★ 아래 게인은 구 물리량(1.36kg·둔감) 기준 "3.6m/s 검증값"이다. 현재
      #   기체는 더 가볍고 응답이 빨라 SITL 재검증이 필요하다.
      #   빠른 표적 못 잡으면 pn_nav_gain ↑ / 떨리면 pn_nav_gain ↓ 또는 alpha·beta ↓
      #   과조향·발진이면 pn_nav_gain 과 kp 부터 낮춘다.
      pn_nav_gain: 175.0      # = 옛 50 x att_p 3.5. LOS각속도 → 각속도 명령
      pn_center_gain: 52.5    # = 옛 15 x att_p 3.5. err→0 정면조준. 정지표적은 ↑
      pn_alpha: 0.35          # alpha-beta 위치이득 (표적 상태추정)
      pn_beta: 0.02           # alpha-beta 속도이득 (LOS각속도 추정). 낮추면 리드가 매끈해짐
      pn_los_clamp: 1.5       # LOS각속도 제한. 근거리 폭주(±2↑) 차단. 0=무제한

      # ── 출력 제한 (각속도) ────────────────────────────────────────────
      max_cmd_rate_dps: 227.5 # 유도가 낼 수 있는 최대 각속도.
      max_rate_dps: 400.0     # 풀스틱 각속도 = PX4 MC_ACRO_R/P_MAX (run_arms.sh 가 400 으로 설정)

      # ── 추력 ──────────────────────────────────────────────────────────
      # TRACK 추력은 hover_throttle ↔ track_throttle 보간이 전부다. 겨냥이 좋을수록
      # (오차 < pursuit_gate) track 쪽으로, 빗나가면 hover 쪽으로 붙는다.
      #   물리량 AUW 1.05kg · 추력 4kgf · TWR≈3.81 · 호버≈0.51 기준.
      hover_throttle: 0.51    # 빗나갔을 때 최소 상승(재조준). MPC_THR_HOVER 와 일치
      track_throttle: 0.85    # 잘 겨눴을 때 최대 상승(표적쪽 돌진). 못 쫓으면 ↑
      pursuit_gate: 0.25      # 오차 이 이하면 full 상승 (pursuit_center_boost=true 일 때만 의미)
      # 중앙 정렬될수록 추력 세지는 로직 on/off. false=정렬 무관 상수 추력(track_throttle 고정).
      pursuit_center_boost: false   # ★ 비활성화(요청). true 면 기존처럼 center_q 로 hover↔track 보간

      # ── 오차 필터 ─────────────────────────────────────────────────────
      error_lpf_alpha: 0.25
      deriv_lpf_alpha: 0.25
      # ★ deadzone 은 감산형이다: |오차|<dz 면 출력 0, 그 위는 dz 를 뺀 값.
      #   따라서 PID 의 평형점이 화면 중심이 아니라 |오차| = dz 가 된다.
      #   0.04 이던 시절 "표적이 중앙에 안 붙고 근처에서 멈추는" 증상의 직접 원인.
      #   순수 P 성능을 보려고 0 으로 뒀다. 중심에서 지터가 보이면 0.01~0.02 부터.
      deadzone: 0.0

      # ── 무장(arm) ─────────────────────────────────────────────────────
      # 자동 모드: 스위치와 분리하고 상태머신 상태로 컨트롤 노드가 결정한다.
      #   SEARCH/LOCK(throttle 0) 에서 미리 arm → TRACK 에서 throttle↑ 전에 무장
      #   완료 (PX4 의 high-throttle arm 거부 회피). SITL 전용.
      auto_arm_states: ["SEARCH", "LOCK", "TRACK", "FIRE", "RTL"]

      # 수동 모드: arm 하는 순간 스틱이 idle 이어야만 실제로 무장한다 (급상승/오발 방지).
      prearm_check: true
      prearm_throttle_max: -0.85   # throttle(axes[1]) 이 값 이하(최저)여야 arm 허용
      prearm_stick_tol: 0.15       # roll/pitch/yaw 중앙 허용오차
